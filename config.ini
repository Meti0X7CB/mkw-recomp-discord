; mkw-recomp-discord settings

; Discord application to show the status as. The default app is named "Mario Kart World"
; and has the icon art; use your own Application ID (https://discord.com/developers/applications)
; if you want a different name or art.
client_id = 1572963800900960298

; Leave these blank to find the game automatically: mkw.exe is looked for next to this
; script and one folder above it, and the log is read from the game data folder named in
; the launcher's mkw.ini. Set full paths here if your setup is different.
game_exe =
game_log =

; Key of the Rich Presence art asset on the Discord application (blank for none).
large_image = icon

; Credit for the port: shown as the status's second line and hover text, plus a button
; others can click (Discord hides buttons on your own view of your profile).
; Leave project_url blank to drop the button and links.
project_name = MKW Recomp
project_url = https://github.com/adriadam10/mkw-recomp
button_label = MKW Recomp on GitHub
